name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          cat payload/v083_00.b64 payload/v083_01.b64 payload/v083_02.b64 payload/v083_03.b64 payload/v083_04.b64 payload/v083_05.b64 payload/v083_06.b64 payload/v083_07.b64 | base64 -d > appbuild.zip
          unzip -q -o appbuild.zip || test $? -eq 2
          cp repair/Id3v24Writer.java app/src/main/java/hu/mp3albumtagger/Id3v24Writer.java
          cp repair/activity_main_v085.xml app/src/main/res/layout/activity_main.xml
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -s app/src/main/java/hu/mp3albumtagger/Id3v24Writer.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MP3-Album-Tagger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
