name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          test -f bootstrap/chunk_aa.b64
          base64 -d bootstrap/chunk_aa.b64 > appbuild.zip
          unzip -q -o appbuild.zip
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MP3-Album-Tagger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
