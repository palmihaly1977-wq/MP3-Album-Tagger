name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          cat payload/v083_00.b64 payload/v083_01.b64 payload/v083_02.b64 payload/v083_03.b64 payload/v083_04.b64 payload/v083_05.b64 payload/v083_06.b64 payload/v083_07.b64 | base64 -d > appbuild.zip
          unzip -q -o appbuild.zip || test $? -eq 2
          cp repair/Id3v24Writer.java app/src/main/java/hu/mp3albumtagger/Id3v24Writer.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/res/layout/activity_main.xml")
          s=p.read_text()
          start=s.find("<LinearLayout")
          end=s.rfind("</LinearLayout>")
          if start < 0 or end < 0: raise SystemExit("Expected LinearLayout root not found")
          opening_end=s.find(">",start)+1
          opening=s[start:opening_end]
          inner=s[opening_end:end]
          # Preserve every original view/id; only make the whole existing screen vertically scrollable.
          opening=opening.replace('android:layout_height="match_parent"','android:layout_height="wrap_content"',1)
          scroll='<ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:fillViewport="true" android:scrollbars="vertical">'
          # Namespace already belongs to the root; remove duplicate declaration from nested LinearLayout.
          opening=opening.replace('xmlns:android="http://schemas.android.com/apk/res/android"','')
          out=s[:start]+scroll+opening+inner+"</LinearLayout></ScrollView>"+s[end+len("</LinearLayout>"):]
          out=out.replace("MP3 Album Tagger – Android v0.50","MP3 Album Tagger – Android v0.84")
          p.write_text(out)
          PY
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -s app/src/main/java/hu/mp3albumtagger/Id3v24Writer.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MP3-Album-Tagger-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
